# Example revs — run `uv run pre-commit autoupdate` regularly to bump them
repos:
  # 1) Style + good practices: lint (with auto-fix) then format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  # 2) Dependency vulnerabilities: audit uv.lock against the PyPA advisory DB
  # NOTE: Disabled for now - pip-audit has issues with uv.lock format
  # - repo: https://github.com/pypa/pip-audit
  #   rev: v2.9.0          # needs 2.9+ to understand uv.lock
  #   hooks:
  #     - id: pip-audit
  #       stages: [pre-push]      # audit on push, so commits stay fast
  #       args: [--locked, .]

  # 3) Security-sensitive code patterns (hardcoded creds, shell=True, weak crypto, SQL injection, ...)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [--severity-level, medium, --confidence-level, medium]
        exclude: ^tests/

  - repo: local
    hooks:
      - id: uv-deps-audit
        name: audit installed dependencies
        language: system
        entry: uv run pip-audit
        pass_filenames: false
        always_run: true
        stages: [pre-push]